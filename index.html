<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="家庭菜单：看看今天可以吃什么。" />
    <meta name="theme-color" content="#f5f4ef" />
    <title>今天吃什么</title>
    <link rel="stylesheet" href="./styles.css?v=4" />
    <script src="./data/menu.js?v=3" defer></script>
    <script src="./app.js?v=4" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <h1>今天吃什么</h1>
      </header>

      <section class="menu-section" aria-labelledby="menu-title">
        <div class="menu-toolbar">
          <h2 id="menu-title">
            菜单
            <span class="dish-count" id="dish-count" aria-live="polite"></span>
          </h2>

          <label class="search-box" id="search-box" for="dish-search" hidden>
            <span class="sr-only">搜索菜名</span>
            <input
              id="dish-search"
              type="search"
              placeholder="搜索菜名"
              autocomplete="off"
              disabled
            />
          </label>
        </div>

        <div class="status-card" id="loading-state" role="status">加载中…</div>
        <div class="dish-grid" id="dish-grid" hidden></div>

        <div class="status-card" id="empty-state" hidden></div>

        <div class="status-card status-card-error" id="error-state" hidden>
          菜单读取失败，请刷新页面重试。
        </div>
      </section>
    </main>

    <noscript>
      <div class="noscript-message">请启用 JavaScript 以查看菜单。</div>
    </noscript>
  </body>
</html>
