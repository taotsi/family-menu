name: Deploy family menu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate menu data
        shell: bash
        run: |
          node -e "require('./data/menu.js');const menu=globalThis.FAMILY_MENU;if(!menu||!Array.isArray(menu.dishes)||menu.dishes.some(d=>!d||typeof d.name!=='string'||!d.name.trim())){throw new Error('Every dish must have a non-empty name')}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          mkdir _site
          cp index.html styles.css app.js .nojekyll _site/
          cp -R data _site/data

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
